name: App

on:
  push:
    branches: [master]
    paths: ["app/**", "wasm/**", "core/src/**", "core/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "test-vectors/**", ".github/workflows/app.yml"]
  pull_request:
    branches: [master]
    paths: ["app/**", "wasm/**", "core/src/**", "core/Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "test-vectors/**", ".github/workflows/app.yml"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The app runs keystone-core's checks as WebAssembly, built from wasm/ before each npm
      # step below (npm run wasm).
      - name: Install Rust (version and wasm target from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
