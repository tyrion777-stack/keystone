name: App

on:
  push:
    branches: [master]
    paths: ["app/**", ".github/workflows/app.yml"]
  pull_request:
    branches: [master]
    paths: ["app/**", ".github/workflows/app.yml"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run build
