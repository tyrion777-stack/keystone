name: Rust (core, relay)

on:
  push:
    branches: [master]
    paths: ["rust-toolchain.toml", "core/**", "relay/**", "test-vectors/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]
  pull_request:
    branches: [master]
    paths: ["rust-toolchain.toml", "core/**", "relay/**", "test-vectors/**", "Cargo.toml", "Cargo.lock", ".github/workflows/rust.yml"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version and components come from rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features

      - name: Test
        run: cargo test --workspace --all-features

      # Services verifying passkeys and requests build without the P2P stack.
      - name: Test without networking
        run: cargo test -p keystone-core --no-default-features
