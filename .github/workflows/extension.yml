name: Extension

on:
  push:
    branches: [master]
    paths: ["extension/**", "test-vectors/**", ".github/workflows/extension.yml"]
  pull_request:
    branches: [master]
    paths: ["extension/**", "test-vectors/**", ".github/workflows/extension.yml"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
